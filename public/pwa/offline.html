<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>CS2 PRO — offline</title>
    <style>
      html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font:16px/1.5 system-ui,sans-serif}
      main{display:flex;min-height:100%;align-items:center;justify-content:center;padding:24px;text-align:center}
      img{width:72px;height:72px;border-radius:16px}
      h1{font-size:20px;margin:16px 0 8px;letter-spacing:.06em;text-transform:uppercase}
      p{margin:4px 0;color:#9aa4b2;max-width:420px}
      button{margin-top:20px;background:#a3e635;color:#0d1117;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="/pwa/icon-192.png" alt="" />
        <h1>CS2 PRO</h1>
        <p lang="pt-BR">Sem conexão. Seus dados não são exibidos offline para nunca mostrar números desatualizados.</p>
        <p lang="en">You are offline. Your data is not shown offline, so you never see outdated numbers.</p>
        <button type="button" onclick="location.reload()">↻</button>
      </div>
    </main>
  </body>
</html>
