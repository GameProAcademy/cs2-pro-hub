name: Parser Runtime Attestation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-runtime:
    if: github.repository == 'GameProAcademy/cs2-pro-hub' && github.ref_name == 'infra/cs2-parser-worker-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout attestor source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen runtime branch and commit as Git objects
        run: |
          git fetch --no-tags origin \
            infra/cs2-parser-worker-v8:refs/remotes/origin/infra/cs2-parser-worker-v8
          git cat-file -e 5703b1d88f21ee57fdd1d83722edf30e0f0c6f76^{commit}
          git merge-base --is-ancestor \
            5703b1d88f21ee57fdd1d83722edf30e0f0c6f76 \
            refs/remotes/origin/infra/cs2-parser-worker-v8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fail-closed runtime evidence
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: python scripts/parser_runtime_attestation.py parser-runtime-attestation.json

      - name: Attest the evidence artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: parser-runtime-attestation.json

      - name: Mint short-lived GitHub identity token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('gamepro-parser-attestation')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Sign and deliver verified evidence to the server-side recorder
        env:
          PARSER_ATTESTATION_ENDPOINT: ${{ secrets.PARSER_ATTESTATION_ENDPOINT }}
          PARSER_ATTESTATION_TRANSPORT_SECRET: ${{ secrets.PARSER_ATTESTATION_TRANSPORT_SECRET }}
          PARSER_ATTESTATION_HMAC_SECRET: ${{ secrets.PARSER_ATTESTATION_HMAC_SECRET }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          test -n "$PARSER_ATTESTATION_ENDPOINT"
          test -n "$PARSER_ATTESTATION_TRANSPORT_SECRET"
          test -n "$PARSER_ATTESTATION_HMAC_SECRET"
          test -n "$GITHUB_OIDC_TOKEN"
          canonical_payload="$(jq -cS '.payload' parser-runtime-attestation.json)"
          signature="$(printf '%s' "$canonical_payload" | openssl dgst -sha256 -hmac "$PARSER_ATTESTATION_HMAC_SECRET" -binary | xxd -p -c 256)"
          curl --fail-with-body --silent --show-error \
            --retry 0 \
            -H "Authorization: Bearer $PARSER_ATTESTATION_TRANSPORT_SECRET" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --rawfile result parser-runtime-attestation.json \
              --arg signature "$signature" \
               --arg oidcToken "$GITHUB_OIDC_TOKEN" \
               --argjson releaseGate "$(jq -c '.release_gate_evidence' parser-runtime-attestation.json)" \
              '{result:($result|fromjson),signature:$signature,oidcToken:$oidcToken,releaseGateEvidence:$releaseGate}')" \
            "$PARSER_ATTESTATION_ENDPOINT"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: parser-runtime-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: parser-runtime-attestation.json
          if-no-files-found: error
