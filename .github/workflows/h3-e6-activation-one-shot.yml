name: H.3-E.6 One-Shot Activation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  activate:
    if: >-
      github.repository == 'GameProAcademy/cs2-pro-hub' &&
      github.ref == 'refs/heads/main' &&
      github.event.before == '4c8563c67e83656fc4347372bd17382b8dd4b07f'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch H.3-E.3 external preflight exactly once after registry refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/h3-e3-final-external-preflight.yml/dispatches"             -f ref='main'
          echo "h3_e3_dispatch=REQUESTED"
          echo "attestation_execution=NOT_RUN"
          echo "dem_execution=NOT_RUN"
          echo "provenance_write=NOT_RUN"
          echo "railway_mutation=NOT_RUN"
