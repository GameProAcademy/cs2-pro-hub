name: CS2 Parser Worker CI

on:
  push:
    branches: [infra/cs2-parser-worker-v8]
  pull_request:
    branches: [infra/cs2-parser-worker-v8]
  workflow_dispatch:
    inputs:
      ref:
        description: "Frozen parser branch"
        required: true
        default: "infra/cs2-parser-worker-v8"

permissions:
  contents: read

jobs:
  parser-contract:
    if: github.event_name != 'workflow_dispatch' || inputs.ref == 'infra/cs2-parser-worker-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cs2-demo-parser/requirements-dev.txt
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && pip install -r services/cs2-demo-parser/requirements-dev.txt
      - name: Compile all parser sources
        run: python -m compileall -q services/cs2-demo-parser scripts
      - name: Verify reconciled field matrix
        run: python scripts/generate-parser-field-matrix.py --check
      - name: Verify Canonical mapping inventory remains fail-closed
        run: |
          python scripts/canonical_mapping_gate.py > canonical-mapping-gate.json
          grep -F '"gateStatus":"BLOCKED"' canonical-mapping-gate.json
      - name: Verify pinned runtime revision
        run: |
          grep -R -F "git:5703b1d88f21ee57fdd1d83722edf30e0f0c6f76" services/cs2-demo-parser/adapter.py
          if test "${{ github.event_name }}" = "workflow_dispatch" && test "${{ github.ref_name }}" = "infra/cs2-parser-worker-v8"; then
            test "$(git rev-parse HEAD)" = "5703b1d88f21ee57fdd1d83722edf30e0f0c6f76"
          fi
      - name: Run runtime and RAW contract tests
        working-directory: services/cs2-demo-parser
        run: >-
          pytest -q
          tests/test_adapter.py
          tests/test_output_contract.py
          tests/test_raw_evidence.py
          tests/test_raw_manifest_audit.py
          tests/test_runtime_contract.py
          tests/test_python_reference.py
          tests/test_forensic_audit_v2.py
      - name: Run governance and attestor unit tests
        run: python -m pytest -q scripts/tests
