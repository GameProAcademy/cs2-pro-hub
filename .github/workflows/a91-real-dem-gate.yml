name: A9.1 Real DEM Python-WASM Parity & Determinism Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: Exact authorized DEM SHA-256
        required: true
        default: 0caa7c9744deec106095895d2dacd19cbfdae689f99e29b0dd4d446b4ec8ae3d
        type: string
      expected_size_bytes:
        description: Exact authorized DEM size
        required: true
        default: "473748061"
        type: string
      authorization_ref:
        description: Independent laboratory authorization reference
        required: true
        default: A9.1-M1-CACHE-REAL-DEM
        type: string
      filename:
        description: Authorized DEM filename
        required: true
        default: furia-vs-gamerlegion-m1-cache.dem
        type: string
      predem_approval_run_id:
        description: >-
          Id of the H.3-E activation run whose PASS (READY_FOR_PREDEM_REVIEW) approves
          this commit. It must be the newest completed activation run, for the current
          head of main, at most 6 hours old. There is no default and no override.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs before anything is downloaded or built. A missing, stale, superseded or
  # non-PASS pre-DEM approval stops the workflow here.
  predem-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      approval_run_id: ${{ steps.check.outputs.approval_run_id }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the pre-DEM approval for this exact commit
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREDEM_APPROVAL_RUN_ID: ${{ inputs.predem_approval_run_id }}
          A91_PREDEM_OUT: a91-predem-approval.json
        run: python3 scripts/ci/a91_predem_postdem.py precondition
      - name: Preserve the approval record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a91-predem-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: a91-predem-approval.json
          if-no-files-found: error
          retention-days: 30

  isolated-gate:
    needs: predem-approval
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.predem-approval.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_COMMIT: d3767705dc5846d73ed29db50eaeda58778dc934
      UPSTREAM_TAG: v0.42.0
      RUST_VERSION: 1.91.1
      WASM_PACK_VERSION: 0.13.1
      WASM_BINDGEN_VERSION: 0.2.100
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install reference dependencies
        run: pip install -r services/cs2-demo-parser/requirements.txt
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.9.0"
          check-latest: false
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_VERSION}"
          rustup default "${RUST_VERSION}"
          rustc --version
          cargo --version
      - name: Install pinned wasm-pack and wasm-bindgen CLI
        run: |
          cargo +"${RUST_VERSION}" install wasm-pack --version "${WASM_PACK_VERSION}" --locked
          cargo +"${RUST_VERSION}" install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          wasm-pack --version
          wasm-bindgen --version
          test "$(wasm-bindgen --version | awk '{print $2}')" = "${WASM_BINDGEN_VERSION}"
      - name: Verify Node runtime and runner resources
        run: |
          node --version
          python --version
          echo "CPU_COUNT=$(nproc)"
          echo "MEMORY:"
          free -h
          echo "DISK:"
          df -h "$RUNNER_TEMP"
          echo "ULIMIT:"
          ulimit -a
      - name: Execute isolated hermetic A9.1 remediation + real DEM gate
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
          A91_WASM_ARTIFACT_DIR: ${{ runner.temp }}/wasm-pkg
          A91_WASM_MANIFEST: ${{ runner.temp }}/artifact-manifest.json
          # The DEM comes from the official reference fixture (r5_forensic_staging), resolved by
          # the application after it re-proves the fixture's identity; bytes are verified again.
          A91_FIXTURE_SOURCE: official-r5-forensic-staging
          PARSER_ATTESTATION_TRANSPORT_SECRET: ${{ secrets.PARSER_ATTESTATION_TRANSPORT_SECRET }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          DEM_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE_BYTES: ${{ inputs.expected_size_bytes }}
          DEM_SIZE: ${{ inputs.expected_size_bytes }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          DEM_AUTH: ${{ inputs.authorization_ref }}
          DEMO_FILENAME: ${{ inputs.filename }}
          DEM_FILENAME: ${{ inputs.filename }}
        run: python scripts/a91/rebuild_wasm_large_demo.py
      - name: Print bounded gate decision
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'a91-artifacts' / 'a91_real_dem_report.json'
          if not path.is_file():
              print('A91_PUBLIC_DECISION_REPORT=MISSING')
          else:
              value = json.loads(path.read_text())
              allowed = {
                  'status': value.get('status'),
                  'reason': value.get('reason'),
                  'stage': value.get('stage'),
                  'failedStage': value.get('failedStage'),
                  'errorDigest': value.get('errorDigest'),
              }
              print('A91_PUBLIC_DECISION=' + json.dumps(allowed, sort_keys=True, separators=(',', ':')))
          PY
      - name: Check sanitized upload guard
        id: upload-guard
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          safe = (Path(os.environ['RUNNER_TEMP']) / 'a91-upload-safe').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('safe=' + str(safe).lower() + '\n')
          PY
      # The same sealed, public values as the uploaded reports, attached to the
      # check run itself so the decision can be audited without the artifact.
      - name: Publish bounded decision as check annotations
        if: always() && steps.upload-guard.outputs.safe == 'true'
        run: python scripts/a91/publish_annotations.py real "$RUNNER_TEMP/a91-artifacts"
      - name: State that no sealed decision is available
        if: always() && steps.upload-guard.outputs.safe != 'true'
        run: echo '::notice title=A91 decision::{"sealedReports":"NOT_AVAILABLE"}'
      - name: Upload sanitized bounded reports only
        if: always() && steps.upload-guard.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a91-real-dem-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a91-artifacts/a91_real_dem_report.json
            ${{ runner.temp }}/a91-artifacts/parity_report.json
            ${{ runner.temp }}/a91-artifacts/determinism_report.json
          retention-days: 3
          if-no-files-found: error
      # The four post-DEM gates, from this run's sealed public reports only (and
      # only when the upload guard marked them safe), bound to the approval the
      # predem-approval job verified. Never consulted for the pre-DEM decision.
      - name: Reconcile the post-DEM gates
        if: always()
        env:
          APPROVAL_RUN_ID: ${{ needs.predem-approval.outputs.approval_run_id }}
          REPORTS_SAFE: ${{ steps.upload-guard.outputs.safe }}
          A91_POSTDEM_OUT: ${{ runner.temp }}/a91-postdem/a91-postdem-reconciliation.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a91-postdem" "$RUNNER_TEMP/a91-postdem/no-reports"
          python3 -c 'import json,os,sys; json.dump({"ok": True, "approval": {"run_id": os.environ["APPROVAL_RUN_ID"], "sha": os.environ["GITHUB_SHA"]}}, open(sys.argv[1], "w"))' "$RUNNER_TEMP/a91-postdem/approval.json"
          if [ "$REPORTS_SAFE" = "true" ]; then reports="$RUNNER_TEMP/a91-artifacts"; else reports="$RUNNER_TEMP/a91-postdem/no-reports"; fi
          A91_PREDEM_FILE="$RUNNER_TEMP/a91-postdem/approval.json" A91_REPORTS_DIR="$reports" \
            python3 scripts/ci/a91_predem_postdem.py postdem
      - name: Preserve the post-DEM reconciliation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a91-postdem-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a91-postdem/a91-postdem-reconciliation.json
          if-no-files-found: error
          retention-days: 30
      - name: Final private-file cleanup
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in Path(os.environ['RUNNER_TEMP']).glob('a91-private-*'):
              shutil.rmtree(path)
          PY
