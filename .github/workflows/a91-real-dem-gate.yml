name: A9.1 Real DEM Python-WASM Parity & Determinism Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: Exact authorized DEM SHA-256
        required: true
        default: 0caa7c9744deec106095895d2dacd19cbfdae689f99e29b0dd4d446b4ec8ae3d
        type: string
      expected_size_bytes:
        description: Exact authorized DEM size
        required: true
        default: "473748061"
        type: string
      authorization_ref:
        description: Independent laboratory authorization reference
        required: true
        default: A9.1-M1-CACHE-REAL-DEM
        type: string
      filename:
        description: Authorized DEM filename
        required: true
        default: furia-vs-gamerlegion-m1-cache.dem
        type: string

permissions:
  contents: read

jobs:
  isolated-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install reference dependencies
        run: pip install -r services/cs2-demo-parser/requirements.txt
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.9.0"
          check-latest: false
          package-manager-cache: false
      - name: Verify Node runtime and runner resources
        run: |
          node --version
          python --version
          echo "CPU_COUNT=$(nproc)"
          echo "MEMORY:"
          free -h
          echo "DISK:"
          df -h "$RUNNER_TEMP"
          echo "ULIMIT:"
          ulimit -a
      - name: Execute isolated four-run gate
        env:
          A91_DEMO_URL: ${{ secrets.A91_DEMO_URL }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE_BYTES: ${{ inputs.expected_size_bytes }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          DEMO_FILENAME: ${{ inputs.filename }}
        run: python scripts/a91/execute.py
      - name: Print bounded gate decision
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'a91-artifacts' / 'a91_real_dem_report.json'
          if not path.is_file():
              print('A91_PUBLIC_DECISION_REPORT=MISSING')
          else:
              value = json.loads(path.read_text())
              allowed = {
                  'status': value.get('status'),
                  'reason': value.get('reason'),
                  'stage': value.get('stage'),
                  'failedStage': value.get('failedStage'),
                  'errorDigest': value.get('errorDigest'),
              }
              print('A91_PUBLIC_DECISION=' + json.dumps(allowed, sort_keys=True, separators=(',', ':')))
          PY
      - name: Check sanitized upload guard
        id: upload-guard
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          safe = (Path(os.environ['RUNNER_TEMP']) / 'a91-upload-safe').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('safe=' + str(safe).lower() + '\n')
          PY
      - name: Upload sanitized bounded reports only
        if: always() && steps.upload-guard.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a91-real-dem-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a91-artifacts/a91_real_dem_report.json
            ${{ runner.temp }}/a91-artifacts/parity_report.json
            ${{ runner.temp }}/a91-artifacts/determinism_report.json
          retention-days: 3
          if-no-files-found: error
      - name: Final private-file cleanup
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in Path(os.environ['RUNNER_TEMP']).glob('a91-private-*'):
              shutil.rmtree(path)
          PY
