name: R5.8.4 Read-Only Gate Reconciliation

# Reconciles the evidence of one R5.8.3 run into the 32-gate matrix. It runs
# whether that R5.8.3 run passed or failed (a failed preflight still uploads its
# evidence), uses the reconciler at the same commit, derives the test gates
# from the R5.8.3 run's own test step, and fails unless the matrix is complete.

on:
  workflow_run:
    workflows:
      - R5.8.3 Read-Only Release Preflight
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    if: >-
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The source run's commit is on main (branch filter and the checks below),
      # so its own reconciler is the trusted one for its evidence.
      - name: Checkout the commit of the R5.8.3 run
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download and validate R5.8.3 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r583-artifact"
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          expected_sha = os.environ["SOURCE_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              source = json.load(r)
          if source.get("name") != "R5.8.3 Read-Only Release Preflight":
              raise SystemExit("R583_SOURCE_WORKFLOW_MISMATCH")
          if source.get("status") != "completed" or source.get("conclusion") not in ("success", "failure"):
              raise SystemExit("R583_SOURCE_NOT_COMPLETED")
          if source.get("head_branch") != "main":
              raise SystemExit("R583_SOURCE_BRANCH_MISMATCH")
          if (source.get("repository") or {}).get("full_name") != repo:
              raise SystemExit("R583_SOURCE_REPOSITORY_MISMATCH")
          if source.get("head_sha") != expected_sha:
              raise SystemExit("R583_SOURCE_SHA_MISMATCH")
          jobs_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(jobs_req, timeout=30) as r:
              jobs = json.load(r).get("jobs")
          open(os.path.join(os.environ["RUNNER_TEMP"], "r583-artifact", "jobs.json"), "w").write(json.dumps(jobs, sort_keys=True))
          print(json.dumps({
              "source_run_id": run_id,
              "source_sha": expected_sha,
              "source_conclusion": source.get("conclusion"),
              "latest_check": "NOT_REQUIRED",
              "exact_trigger_run_verified": True,
          }, sort_keys=True))
          PY
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          expected_sha = os.environ["SOURCE_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          candidates = [
              a for a in data.get("artifacts", [])
              if a.get("name","").startswith("r5-8-3-preflight-")
              and not a.get("expired", False)
              and (a.get("workflow_run") or {}).get("head_sha") == expected_sha
          ]
          if len(candidates) != 1:
              raise SystemExit(f"EXPECTED_ONE_R583_ARTIFACT_GOT_{len(candidates)}")
          artifact = candidates[0]
          open(os.path.join(os.environ["RUNNER_TEMP"], "r583-artifact", "metadata.json"), "w").write(json.dumps(artifact, sort_keys=True))
          print(json.dumps({
              "artifact_id": artifact["id"],
              "name": artifact["name"],
              "digest": artifact.get("digest"),
              "head_sha": (artifact.get("workflow_run") or {}).get("head_sha"),
          }, sort_keys=True))
          PY
          ARTIFACT_URL=$(python - <<'PY'
          import json, os
          m=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"r583-artifact","metadata.json")))
          print(m["archive_download_url"])
          PY
          )
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${ARTIFACT_URL}" -o "${RUNNER_TEMP}/r583-artifact/artifact.zip"
          python - <<'PY'
          import hashlib, json, os, zipfile
          root=os.path.join(os.environ["RUNNER_TEMP"],"r583-artifact")
          meta=json.load(open(os.path.join(root,"metadata.json")))
          blob=open(os.path.join(root,"artifact.zip"),"rb").read()
          observed="sha256:"+hashlib.sha256(blob).hexdigest()
          if observed != meta.get("digest"):
              raise SystemExit("R583_ARTIFACT_DIGEST_MISMATCH")
          with zipfile.ZipFile(os.path.join(root,"artifact.zip")) as z:
              names=z.namelist()
              if names != ["r5-8-3-preflight.json"]:
                  raise SystemExit(f"UNEXPECTED_ARTIFACT_CONTENT:{names}")
              z.extract("r5-8-3-preflight.json", root)
          print("R583_ARTIFACT_INTEGRITY_OK")
          PY

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Run R5.8.4 reconciler tests
        run: python -m pytest -q --ignore=services/cs2-demo-parser/tests scripts/tests/test_r5_8_4_gate_reconciliation.py

      - name: Reconcile all 32 gates fail-closed
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from scripts.r5_8_4_gate_reconciliation import (
              annotations, exit_code, focused_tests_passed, reconcile_r5_8_3_preflight)
          root=Path(os.environ["RUNNER_TEMP"])/"r583-artifact"
          preflight=json.loads((root/"r5-8-3-preflight.json").read_text())
          jobs=json.loads((root/"jobs.json").read_text())
          result=reconcile_r5_8_3_preflight(
              preflight,
              workflow_run_id=os.environ["SOURCE_RUN_ID"],
              workflow_run_sha=os.environ["SOURCE_SHA"],
              test_suite_passed=focused_tests_passed(jobs),
          )
          Path("r5-8-4-gate-reconciliation.json").write_text(
              json.dumps(result, sort_keys=True, indent=2)+"\n"
          )
          for line in annotations(result):
              print(line)
          sys.exit(exit_code(result))
          PY

      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-8-4-gate-reconciliation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.head_sha }}
          path: r5-8-4-gate-reconciliation.json
          if-no-files-found: error
          retention-days: 14
