name: R5.8.4 Read-Only Gate Reconciliation

on:
  workflow_run:
    workflows:
      - R5.8.3 Read-Only Release Preflight
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download and validate R5.8.3 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r583-artifact"
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          expected_sha = os.environ["SOURCE_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?branch=main&event=push&status=completed&per_page=100",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          candidates = [
              r for r in data.get("workflow_runs", [])
              if r.get("name") == "R5.8.3 Read-Only Release Preflight"
              and r.get("conclusion") == "success"
              and r.get("head_branch") == "main"
              and (r.get("repository") or {}).get("full_name") == repo
          ]
          if not candidates:
              raise SystemExit("NO_SUCCESSFUL_R583_RUN")
          latest = max(candidates, key=lambda r: r.get("created_at", ""))
          if str(latest.get("id")) != run_id:
              raise SystemExit(f"STALE_R583_SOURCE_RUN:{run_id}:LATEST:{latest.get('id')}")
          if latest.get("head_sha") != expected_sha:
              raise SystemExit("R583_SOURCE_SHA_MISMATCH")
          print(json.dumps({"source_run_id": run_id, "source_sha": expected_sha, "latest": True}, sort_keys=True))
          PY
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          expected_sha = os.environ["SOURCE_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          candidates = [
              a for a in data.get("artifacts", [])
              if a.get("name","").startswith("r5-8-3-preflight-")
              and not a.get("expired", False)
              and (a.get("workflow_run") or {}).get("head_sha") == expected_sha
          ]
          if len(candidates) != 1:
              raise SystemExit(f"EXPECTED_ONE_R583_ARTIFACT_GOT_{len(candidates)}")
          artifact = candidates[0]
          open(os.path.join(os.environ["RUNNER_TEMP"], "r583-artifact", "metadata.json"), "w").write(json.dumps(artifact, sort_keys=True))
          print(json.dumps({
              "artifact_id": artifact["id"],
              "name": artifact["name"],
              "digest": artifact.get("digest"),
              "head_sha": (artifact.get("workflow_run") or {}).get("head_sha"),
          }, sort_keys=True))
          PY
          ARTIFACT_URL=$(python - <<'PY'
          import json, os
          m=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"r583-artifact","metadata.json")))
          print(m["archive_download_url"])
          PY
          )
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${ARTIFACT_URL}" -o "${RUNNER_TEMP}/r583-artifact/artifact.zip"
          python - <<'PY'
          import hashlib, json, os, zipfile
          root=os.path.join(os.environ["RUNNER_TEMP"],"r583-artifact")
          meta=json.load(open(os.path.join(root,"metadata.json")))
          blob=open(os.path.join(root,"artifact.zip"),"rb").read()
          observed="sha256:"+hashlib.sha256(blob).hexdigest()
          if observed != meta.get("digest"):
              raise SystemExit("R583_ARTIFACT_DIGEST_MISMATCH")
          with zipfile.ZipFile(os.path.join(root,"artifact.zip")) as z:
              names=z.namelist()
              if names != ["r5-8-3-preflight.json"]:
                  raise SystemExit(f"UNEXPECTED_ARTIFACT_CONTENT:{names}")
              z.extract("r5-8-3-preflight.json", root)
          print("R583_ARTIFACT_INTEGRITY_OK")
          PY

      - name: Reconcile all 32 gates fail-closed
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.r5_8_4_gate_reconciliation import reconcile_r5_8_3_preflight
          root=Path(os.environ["RUNNER_TEMP"])/"r583-artifact"
          preflight=json.loads((root/"r5-8-3-preflight.json").read_text())
          result=reconcile_r5_8_3_preflight(
              preflight,
              workflow_run_id=os.environ["SOURCE_RUN_ID"],
              workflow_run_sha=os.environ["SOURCE_SHA"],
              test_suite_passed=True,
          )
          Path("r5-8-4-gate-reconciliation.json").write_text(
              json.dumps(result, sort_keys=True, indent=2)+"\n"
          )
          print(json.dumps({
              "decision": result["decision"],
              "gate_count": result["gate_count"],
              "verified": sum(v["status"] == "VERIFIED" for v in result["gates"].values()),
              "blockers": result["blockers"],
              "attempt_9_authorized": result["attempt_9_authorized"],
              "canonical_authorized": result["canonical_authorized"],
          }, sort_keys=True))
          PY

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run R5.8.4 reconciler tests
        run: python -m pytest -q --ignore=services/cs2-demo-parser/tests scripts/tests/test_r5_8_4_gate_reconciliation.py

      - name: Preserve reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-8-4-gate-reconciliation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.head_sha }}
          path: r5-8-4-gate-reconciliation.json
          if-no-files-found: error
          retention-days: 14
