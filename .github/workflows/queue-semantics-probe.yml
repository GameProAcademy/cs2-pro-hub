name: Queue Semantics Probe

# Executes the durable demo-parse queue functions on a DISPOSABLE local
# database built from supabase/migrations and records what they guarantee.
# It never connects to the managed database: the probe refuses any non-local
# host. Supplementary evidence, path-filtered on purpose; not a required check.

on:
  # Every head of main gets its own disposable-database evidence (no path
  # filter): the H.3-E activation gate reads it as the persistence gate.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/queue/**"
      - "services/cs2-demo-parser/**"
      - "src/lib/pipeline/**"
      - "src/lib/canonical/**"
      - "src/routes/api/public/**"
      - ".github/workflows/queue-semantics-probe.yml"
  workflow_dispatch:

concurrency:
  group: queue-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Queue semantics on a disposable database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.118.0
      - name: Start local disposable services
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.118.0"
          supabase start
      - name: Build the disposable schema from the repository migrations
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase db reset --local
      - name: Run the queue semantics probe
        env:
          QUEUE_PROBE_PGHOST: 127.0.0.1
          QUEUE_PROBE_PGPORT: "54322"
          QUEUE_PROBE_PGUSER: postgres
          QUEUE_PROBE_PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 scripts/queue/queue_semantics_probe.py | tee "$RUNNER_TEMP/queue-semantics-report.json"
      - name: Set up Python for the worker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the worker dependencies
        run: python -m pip install -r services/cs2-demo-parser/requirements.txt
      - name: Run the recovery protocol probe (real worker loop, real queue functions, real ledger)
        env:
          QUEUE_PROBE_PGHOST: 127.0.0.1
          QUEUE_PROBE_PGPORT: "54322"
          QUEUE_PROBE_PGUSER: postgres
          QUEUE_PROBE_PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python scripts/queue/recovery_protocol_probe.py | tee "$RUNNER_TEMP/queue-recovery-report.json"
      - name: Run the canonical persistence idempotency probe (synthetic fixture, disposable database)
        env:
          QUEUE_PROBE_PGHOST: 127.0.0.1
          QUEUE_PROBE_PGPORT: "54322"
          QUEUE_PROBE_PGUSER: postgres
          QUEUE_PROBE_PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python scripts/queue/canonical_persistence_probe.py | tee "$RUNNER_TEMP/canonical-persistence-report.json"
      - name: Run the attestation recorder reconciliation probe (R5.8.7, synthetic, rolled back)
        env:
          QUEUE_PROBE_PGHOST: 127.0.0.1
          QUEUE_PROBE_PGPORT: "54322"
          QUEUE_PROBE_PGUSER: postgres
          QUEUE_PROBE_PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python scripts/queue/attestation_recorder_reconciliation_probe.py | tee "$RUNNER_TEMP/attestation-recorder-report.json"
      # R5.8.9 generator mechanics on PostgreSQL 17 (Supabase local): synthetic
      # deployment id, real candidate values, every scenario rolled back.
      - name: Validate the generated R5.8.9 re-pin on the disposable database (synthetic, rolled back)
        env:
          QUEUE_PROBE_PGHOST: 127.0.0.1
          QUEUE_PROBE_PGPORT: "54322"
          QUEUE_PROBE_PGUSER: postgres
          QUEUE_PROBE_PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          status=0
          python scripts/repin/validate_r5_8_9_disposable.py > "$RUNNER_TEMP/r5-8-9-report.txt" || status=$?
          python3 - "$RUNNER_TEMP/r5-8-9-report.txt" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          if "RESULT:" not in text:
              print("::error title=R5.8.9 disposable::" + json.dumps({"status": "NO_RESULT"}))
              raise SystemExit(0)
          d = json.loads(text[text.index("RESULT:") + 7:])
          summary = {k: d[k] for k in ("probe", "status", "passed", "total", "target_md5", "database", "test_deployment_id")}
          summary["not_passed"] = [s["scenario"] for s in d["scenarios"] if s["status"] != "PASS"]
          level = "notice" if d["status"] == "PASS" else "error"
          print(f"::{level} title=R5.8.9 disposable::" + json.dumps(summary, sort_keys=True))
          PY
          exit $status
      - name: Publish the probe verdicts as annotations
        if: always()
        run: python scripts/queue/publish_probe_annotations.py "$RUNNER_TEMP/queue-semantics-report.json" "$RUNNER_TEMP/queue-recovery-report.json" "$RUNNER_TEMP/canonical-persistence-report.json" "$RUNNER_TEMP/attestation-recorder-report.json"
      - name: Upload the probe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-semantics-report
          path: |
            ${{ runner.temp }}/queue-semantics-report.json
            ${{ runner.temp }}/queue-recovery-report.json
            ${{ runner.temp }}/canonical-persistence-report.json
            ${{ runner.temp }}/attestation-recorder-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down disposable services
        if: always()
        run: supabase stop --no-backup

  end-to-end:
    name: Queue recovery end to end (real worker, real bridge, real storage)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.118.0
      - name: Start local disposable services
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.118.0"
          supabase start
      - name: Build the disposable schema from the repository migrations
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase db reset --local
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python for the worker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the worker dependencies
        run: python -m pip install -r services/cs2-demo-parser/requirements.txt
      - name: Run the end-to-end recovery probe
        run: |
          set -euo pipefail
          python scripts/queue/recovery_integration_probe.py > "$RUNNER_TEMP/queue-e2e-report.json"
        env:
          QUEUE_E2E_STOP_ON_FAIL: "1"
      - name: Publish the probe verdict as annotations
        if: always()
        run: python scripts/queue/publish_probe_annotations.py "$RUNNER_TEMP/queue-e2e-report.json"
      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-e2e-report
          path: ${{ runner.temp }}/queue-e2e-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down disposable services
        if: always()
        run: supabase stop --no-backup
