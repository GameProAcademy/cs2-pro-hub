name: A91 Remediation One-Shot Launcher

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-clean:
    runs-on: ubuntu-24.04
    if: github.event.head_commit.message != 'chore(a91): remove one-shot remediation launcher [a91-launcher-cleanup]'
    steps:
      - name: Dispatch remediation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/a91-wasm-rebuild-promote.yml/dispatches"
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}"             -d '{"ref":"main","inputs":{"expected_sha256":"0caa7c9744deec106095895d2dacd19cbfdae689f99e29b0dd4d446b4ec8ae3d","expected_size_bytes":"473748061","authorization_ref":"A9.1-M1-CACHE-REAL-DEM","filename":"furia-vs-gamerlegion-m1-cache.dem","promote_on_pass":"true"}}'
      - name: Wait for dispatched workflow registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in {1..30}; do
            count="$(curl --fail -sS               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/workflows/a91-wasm-rebuild-promote.yml/runs?per_page=20"               | python -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for x in d["workflow_runs"] if x["head_sha"]=="${{ github.sha }}"))')"
            if [ "${count}" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Remove one-shot launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=".github/workflows/a91-remediation-launcher.yml"
          sha="$(curl --fail -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/contents/${path}?ref=main"             | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          curl --fail-with-body -sS -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "$(printf "https://api.github.com/repos/${{ github.repository }}/contents/${path}")"             -d '{"message":"chore(a91): remove one-shot remediation launcher [a91-launcher-cleanup]","sha":"'"$sha"'","branch":"main"}'
