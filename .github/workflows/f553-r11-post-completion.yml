name: F553 R11 Post-Completion Attestation

on:
  workflow_run:
    workflows: [Quality Gates]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  f553-r11-post-completion:
    name: F553 R11.2 POST-COMPLETION ATTESTATION
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact completed execution source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Independently inspect completed run and its artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          F553_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          F553_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          F553_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          F553_SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          F553_SOURCE_REF: refs/heads/${{ github.event.workflow_run.head_branch }}
        run: python3 scripts/f553-r11-post-completion-attest.py
      - name: Preserve independent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f553-r11-post-completion-attestation
          path: /tmp/f553-r11-post-completion.json
          if-no-files-found: error
