name: Quality Gates
# Independent proof trigger anchor; no product/runtime behavior change.
# R11.2 disposable verification trigger: run on the committed fail-closed harness.

on:
  push:
    branches: [main, infra/cs2-parser-worker-v8]
  pull_request:
    branches: [main, infra/cs2-parser-worker-v8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Web tests / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL server binaries for disposable concurrency harness
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: H3E91 source discovery and sealed-ledger gate
        run: bunx vitest run src/lib/pipeline/__tests__/h3e91ExecutionDiscovery.test.ts src/lib/pipeline/__tests__/h3e91LiveEvidence.test.ts src/lib/pipeline/__tests__/h3e91ExecutionBridge.test.ts src/lib/pipeline/__tests__/h3e91ExecutionRecorder.test.ts src/lib/pipeline/__tests__/h3e91R41Coverage.test.ts src/lib/pipeline/__tests__/h3e91R41Authority.test.ts
      - name: H3E91 disposable PostgreSQL writer concurrency
        run: python3 scripts/h3e91-writer-concurrency.py
      - name: H3E91 APP retry and browser isolation regression
        run: bunx vitest run src/lib/pipeline/__tests__/h3e91ExecutionRecorder.test.ts src/lib/pipeline/__tests__/h3e91BrowserBuildIsolation.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Verify browser parser is absent from production output
        run: bun run verify:browser-parser-sealed

  parser-quality:
    name: CS2 parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/cs2-demo-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cs2-demo-parser/requirements-dev.txt
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile parser sources
        run: python -m compileall -q .
      - name: Verify reconciled field governance matrix
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/generate-parser-field-matrix.py --check
          python scripts/canonical_mapping_gate.py > /tmp/canonical-mapping-gate.json
          grep -F '"gateStatus":"BLOCKED"' /tmp/canonical-mapping-gate.json
      - name: Run parser test suite
        run: pytest -q
      - name: H3E91 Railway ordering, stable retries and failure injection
        run: pytest -q tests/test_h3e91_execution.py tests/test_h3e91_failure_injection.py tests/test_worker.py
      - name: Verify production parser image excludes reference tools
        working-directory: ${{ github.workspace }}
        run: |
          docker build --tag gamepro-parser-isolation:ci services/cs2-demo-parser
          docker run --rm --entrypoint python gamepro-parser-isolation:ci -c 'import os,pathlib; p=pathlib.Path("/app"); expected={"adapter.py","app.py","capability_catalog.py","demo_integrity.py","errors.py","forensic_audit.py","h3e91_execution.py","hot_payload.py","parser.py","raw_artifact.py","raw_evidence.py","runtime_evidence.py","settings.py","worker.py","requirements.txt"}; actual={str(x.relative_to(p)) for x in p.rglob("*") if x.is_file()}; assert actual == expected, actual ^ expected; assert os.geteuid() != 0'
  contract-gate:
    name: Contract-sensitive parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cs2-demo-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cs2-demo-parser/requirements-dev.txt
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run round-boundary, output-contract and RAW evidence tests
        run: >-
          pytest -q
          tests/test_adapter.py
          tests/test_output_contract.py
          tests/test_raw_evidence.py
          tests/test_raw_manifest_audit.py
          tests/test_runtime_contract.py

  f553-r11-2-execution:
    name: F553 R11.2 EXECUTION
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Establish disposable run identity and verify Docker
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -n "$(ls supabase/migrations/*.sql)"
          docker version
          docker info > /dev/null
          printf 'F553_RUN_ID=%s\n' "$(python3 -c 'import uuid; print(uuid.uuid4().hex)')" >> "$GITHUB_ENV"
          printf 'F553_STARTED_AT=%s\n' "$(python3 -c 'import time; print(time.time())')" >> "$GITHUB_ENV"
          printf 'Runner=%s Kernel=%s SHA=%s Ref=%s WorkflowRun=%s Job=%s UTC=%s\n' "$RUNNER_OS" "$(uname -r)" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$(date -u +%FT%TZ)"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.118.0
      - name: Start local disposable services
        run: |
          test "$(supabase --version)" = "2.118.0"
          supabase --version
          supabase start
          supabase status
      - name: Reset full disposable schema before integration
        run: supabase db reset --local
      - name: Install real parser runtime for R11.2
        run: python3 -m pip install -r services/cs2-demo-parser/requirements.txt
      - name: Execute R11.2 disposable evidence engine
        run: python3 scripts/f553-r11-execution-engine.py
      - name: Verify R11.2 Job A evidence remains fail-closed
        if: always()
        run: python3 scripts/f553-r11-final-verifier.py
      - name: Verify parser image isolation in this run
        if: always()
        run: |
          set -euo pipefail
          docker build --tag gamepro-parser-isolation:f553 services/cs2-demo-parser
          docker run --rm --entrypoint python gamepro-parser-isolation:f553 -c 'import os,pathlib; p=pathlib.Path("/app"); expected={"adapter.py","app.py","capability_catalog.py","demo_integrity.py","errors.py","forensic_audit.py","h3e91_execution.py","hot_payload.py","parser.py","raw_artifact.py","raw_evidence.py","runtime_evidence.py","settings.py","worker.py","requirements.txt"}; actual={str(x.relative_to(p)) for x in p.rglob("*") if x.is_file()}; assert actual == expected, actual ^ expected; assert os.geteuid() != 0'
          docker image inspect gamepro-parser-isolation:f553 --format '{{.Id}}' > /tmp/f553-image-digest
      - name: Verify parser tests in this run
        if: always()
        run: |
          set -euo pipefail
          python3 -m venv /tmp/f553-parser-venv
          /tmp/f553-parser-venv/bin/pip install -r services/cs2-demo-parser/requirements-dev.txt
          (cd services/cs2-demo-parser && /tmp/f553-parser-venv/bin/pytest -q)
      - name: Verify production browser parser isolation in this run
        if: always()
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build and check production browser output in this run
        if: always()
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          bun run verify:browser-parser-sealed
      - name: Preserve R11.2 disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f553-r11-disposable-evidence
          path: |
            docs/release-gates/f553-r11-execution-evidence.json
            docs/release-gates/f553-r11-race-matrix.json
            docs/release-gates/f553-r11-failure-matrix.json
            docs/release-gates/f553-r11-raw-corruption-matrix.json
            docs/release-gates/f553-r11-final.json
            docs/release-gates/F553-CLOSURE-8-R11-FINAL-REPORT.md
          if-no-files-found: error
      - name: Tear down disposable services
        if: always()
        run: supabase stop --no-backup


# R11.2-R6 verification trigger: validate the latest committed disposable Storage diagnostic.
