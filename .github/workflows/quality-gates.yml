name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    name: Web tests / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  parser-quality:
    name: CS2 parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/cs2-demo-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cs2-demo-parser/requirements-dev.txt

      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run parser test suite
        run: pytest -q

  contract-gate:
    name: Contract-sensitive parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cs2-demo-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cs2-demo-parser/requirements-dev.txt
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run round-boundary, output-contract and RAW evidence tests
        run: >-
          pytest -q
          tests/test_adapter.py
          tests/test_output_contract.py
          tests/test_raw_evidence.py
          tests/test_raw_manifest_audit.py
          tests/test_runtime_contract.py
