name: VGL smoke E2E

# Visual Game Language smoke: every player screen at seven widths and the AI Coach. Manual only;
# signs in with account A of the PM2 suite. Its only possible write is ONE Coach question when
# coach_send = 1. No trace, video or screenshot (public repository): the artifact is a JSON summary.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to test"
        required: true
        default: "https://gamepro.network"
      coach_send:
        description: "Send ONE real question to the AI Coach as the test account (1 = yes)"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: vgl-smoke-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_VGL_SMOKE: "1"
      E2E_COACH_SEND: ${{ inputs.coach_send }}
      E2E_A_EMAIL: ${{ secrets.PM2_E2E_A_EMAIL }}
      E2E_A_PASSWORD: ${{ secrets.PM2_E2E_A_PASSWORD }}
      E2E_SUMMARY_PATH: ${{ github.workspace }}/vgl-smoke-summary.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the account
        run: |
          if [ -z "$E2E_A_EMAIL" ] || [ -z "$E2E_A_PASSWORD" ]; then
            echo "::error::MANUAL_REQUIRED: repository secrets PM2_E2E_A_EMAIL / PM2_E2E_A_PASSWORD"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Playwright (pinned in e2e/package.json)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run
        run: npx playwright test vgl-smoke
      - name: Summary
        if: always()
        run: |
          if [ -f "$E2E_SUMMARY_PATH" ]; then
            { echo '## VGL smoke E2E'; echo; echo "Target: \`$E2E_BASE_URL\` · commit \`$GITHUB_SHA\`"; echo; echo '```json'; cat "$E2E_SUMMARY_PATH"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vgl-smoke-summary
          path: ${{ github.workspace }}/vgl-smoke-summary.json
          if-no-files-found: ignore
          retention-days: 30
